name: Build OpenCode for Windows

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  build-project:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 新增：缓存 Bun 的全局依赖包目录（Windows 路径）
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          # Windows 下 Bun 缓存目录默认为 C:\Users\runneradmin\.bun\install\cache
          # 使用 ~ 可自动展开为用户目录
          path: ~\.bun\install\cache
          # 根据锁文件生成唯一缓存键，锁文件变化时缓存失效
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build executable
        working-directory: ./packages/opencode
        run: |
          echo "CI Build" > ../../.github/TEAM_MEMBERS
          bun run build --single
        env:
          CI: true
          SKIP_TEAM_CHECK: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-builds
          path: |
            ./packages/opencode/dist/**/*
